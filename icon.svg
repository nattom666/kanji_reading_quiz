<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 熟語クイズのアイコン。朱色の地に白い「字」と「？」。iOS が角を丸くするので角丸は付けない -->
  <rect width="512" height="512" fill="#c9553d"/>
  <!-- 原稿用紙のますめ -->
  <rect x="56" y="88" width="248" height="248" fill="none" stroke="#ffffff" stroke-width="10" opacity=".55"/>
  <line x1="180" y1="88" x2="180" y2="336" stroke="#ffffff" stroke-width="4" opacity=".35" stroke-dasharray="14 12"/>
  <line x1="56" y1="212" x2="304" y2="212" stroke="#ffffff" stroke-width="4" opacity=".35" stroke-dasharray="14 12"/>
  <text x="180" y="300" font-family="Hiragino Mincho ProN, YuMincho, serif"
        font-size="200" font-weight="bold" text-anchor="middle" fill="#ffffff">字</text>
  <!-- ふりがなをさがす「？」 -->
  <text x="392" y="392" font-family="Hiragino Maru Gothic ProN, Helvetica, sans-serif"
        font-size="190" font-weight="bold" text-anchor="middle" fill="#ffd23f">?</text>
</svg>
